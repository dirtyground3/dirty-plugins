name: Deploy plugin source to GitHub Pages

# main publishes main/index.yml and prerelease publishes prerelease/index.yml. A deploy replaces the
# whole site, so each run builds its own channel and keeps the other one as published.
on:
  push:
    branches:
      - main
      - prerelease
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == 'main' || github.ref_name == 'prerelease'
    # Python 3.9, the oldest supported backend version, has no build for ubuntu-26.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      CHANNEL: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.0"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.9"

      - name: Check versions for this channel
        run: node scripts/release.mjs check "$CHANNEL"

      - name: Install development dependencies and run checks
        run: |
          npm ci
          npm test

      - name: Build plugin source
        run: |
          chmod +x build_site.sh
          ./build_site.sh "_site/$CHANNEL"
          node scripts/check-packages.mjs "_site/$CHANNEL"

      - name: Keep the other channel
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          other=$([ "$CHANNEL" = main ] && echo prerelease || echo main)
          # A release points both branches at one commit, which then serves both channels.
          if [ "$(git rev-parse -q --verify "origin/$other")" = "$GITHUB_SHA" ]; then
            cp -R "_site/$CHANNEL" "_site/$other"
          else
            node scripts/fetch-channel.mjs "${BASE_URL%/}/$other/index.yml" "_site/$other"
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}${{ github.ref_name }}/index.yml
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
