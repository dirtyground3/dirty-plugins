name: Release prerelease to main

# After prerelease publishes, the release job waits for approval in the "release" environment.
# Approving it removes -rc from the versions, fast-forwards main and prerelease to that commit and
# publishes both channels.
on:
  workflow_run:
    workflows:
      - Deploy plugin source to GitHub Pages
    types:
      - completed
    branches:
      - prerelease

permissions: {}

# A newer prerelease replaces a release that is still waiting for approval.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  candidate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.candidate.outputs.pending }}
    steps:
      - name: Check out prerelease
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: prerelease
          fetch-depth: 0

      - name: Find what main lacks
        id: candidate
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "prerelease has moved past $HEAD_SHA; the newer commit's run offers the release."
          elif git merge-base --is-ancestor HEAD origin/main; then
            echo "main already contains $HEAD_SHA."
          elif [ -n "$(git diff --name-only origin/main HEAD -- .github/workflows)" ]; then
            # The workflow token may not push workflow changes.
            echo "::warning::This prerelease changes .github/workflows, so it must be released by hand (see README, Development and publishing)."
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: candidate
    if: needs.candidate.outputs.pending == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the approved commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.0"

      - name: Release
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main prerelease
          if [ "$(git rev-parse origin/prerelease)" != "$HEAD_SHA" ]; then
            echo "::error::prerelease has moved past the approved commit; approve the newest release instead."
            exit 1
          fi
          node scripts/release.mjs check prerelease
          message=$(node scripts/release.mjs finalize)
          if [ -n "$message" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git commit --all --message "$message"
          fi
          node scripts/release.mjs check main
          git push --atomic origin HEAD:main HEAD:prerelease
          # Pushes made with the workflow token start no workflows, so the deploy is started here.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
