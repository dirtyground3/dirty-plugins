name: DirtyPlugins
description: Required runtime and settings page for Dirty plugins. Install DirtyStats, DirtyRank or another Dirty plugin with it; on its own it adds only a settings link.
version: 1.0.20

ui:
  javascript:
    - dirtyPlugins.js
  css:
    - dirtyPlugins.css

exec:
  - python
  - "{pluginDir}/dirty_plugins.py"
interface: raw
errLog: error
