name: DirtyPlugins
description: Shared settings page for Dirty plugins.
version: 0.5.6

settings:
  visualTheme:
    displayName: Suite theme
    description: Choose the appearance shared by all Dirty Plugins. Native Stash cards and players keep their Stash theme.
    type: STRING

ui:
  javascript:
    - vendor/htm.umd.js
    - dirtyPluginsValues.js
    - dirtyPluginsSceneFilter.js
    - dirtyPlugins.js
  css:
    - dirtyPlugins.css

exec:
  - python
  - "{pluginDir}/dirty_plugins.py"
interface: raw
errLog: error
