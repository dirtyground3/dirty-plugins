name: DirtyCaptions
description: Display embedded text subtitles in the native scene player without separate subtitle files.
version: 1.0.6
ui:
  requires:
    - dirtyPlugins
  javascript:
    - dirtyCaptions.js
  css:
    - dirtyCaptions.css
exec:
  - python
  - "{pluginDir}/dirty_captions.py"
interface: raw
errLog: error
tasks:
  - name: Refresh caption index
    description: Detect embedded subtitle tracks in new or changed scene files; skip known unchanged media using the saved map.
    defaultArgs:
      mode: indexRefresh
  - name: Reprobe caption index
    description: Bypass the saved file map and detect subtitles again in every file, including previous failed checks.
    defaultArgs:
      mode: indexRefresh
      force: true
hooks:
  - name: Maintain caption index
    triggeredBy:
      - Scene.Create.Post
      - Scene.Update.Post
      - Scene.Destroy.Post
    defaultArgs:
      mode: indexHook
