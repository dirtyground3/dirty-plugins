name: DirtyCaptions
description: Display embedded text subtitles in the native scene player without separate subtitle files.
version: 0.2.3
ui:
  requires:
    - dirtyPlugins
  javascript:
    - dirtyCaptionsTracks.js
    - dirtyCaptionsIndex.js
    - dirtyCaptions.js
  css:
    - dirtyCaptions.css
exec:
  - python
  - "{pluginDir}/dirty_captions.py"
interface: raw
errLog: error
tasks:
  - name: Refresh caption index
    description: Detect embedded subtitle tracks in new or changed scene files; skip known unchanged media using the saved map.
    defaultArgs:
      mode: indexRefresh
  - name: Reprobe caption index
    description: Bypass the saved file map and detect subtitles again in every file, including previous failed checks.
    defaultArgs:
      mode: indexRefresh
      force: true
hooks:
  - name: Maintain caption index
    triggeredBy:
      - Scene.Create.Post
      - Scene.Update.Post
      - Scene.Destroy.Post
    defaultArgs:
      mode: indexHook
settings:
  enabled:
    displayName: Load embedded captions
    description: Read embedded text subtitles when a native scene player opens. No subtitle files are created.
    type: BOOLEAN
  showByDefault:
    displayName: Show captions automatically
    description: Select a preferred embedded track when no existing captions are showing. You can change it in the player CC menu.
    type: BOOLEAN
  preferredLanguage:
    displayName: Preferred language
    description: A language code such as en, eng, fr, or fra. Leave blank to use the browser language, then the file default.
    type: STRING
  indexEnabled:
    displayName: Maintain caption index automatically
    description: Index new or updated scenes and refresh caption metadata during playback. An initial library scan starts when a Stash tab opens.
    type: BOOLEAN
  refreshAfterScan:
    displayName: Refresh caption index after Scan
    description: When automatic index maintenance is on, index new or changed files after a successful Scan. Known unchanged media are skipped. Keep a Stash tab open until Scan finishes. Off by default.
    type: BOOLEAN
