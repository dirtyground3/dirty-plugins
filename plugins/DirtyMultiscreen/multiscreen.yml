name: DirtyMultiscreen
description: Immersive multiscreen scene playback grid for Stash.
version: 0.3.3
ui:
  javascript:
  - multiscreen.js
  css:
  - multiscreen.css
settings:
  totalScreens:
    type: NUMBER
    displayName: Total screens
    description: Number of video panes to render. Defaults to 4.
  rows:
    type: NUMBER
    displayName: Rows
    description: Number of grid rows. Defaults to 2.
  columns:
    type: NUMBER
    displayName: Columns
    description: Number of grid columns. Defaults to 2.
  randomize:
    type: BOOLEAN
    displayName: Random scenes
    description: Shuffle scene playback lists. Enabled by default.
  splitScenes:
    type: BOOLEAN
    displayName: Split scenes
    description: Split loaded scenes across panes instead of reusing the same list. Defaults to false.
  startMuted:
    type: BOOLEAN
    displayName: Start muted
    description: Start every video muted. Enabled by default.
  randomStart:
    type: BOOLEAN
    displayName: Random start
    description: Start each scene at a random timestamp after metadata loads. Enabled by default.
  loopScenes:
    type: BOOLEAN
    displayName: Loop scenes
    description: Loop each scene instead of advancing at the end. Enabled by default.
  markerDuration:
    type: NUMBER
    displayName: Marker fallback duration
    description: Seconds to play markers that do not have an end time. Defaults to 30.
  pauseWhenHidden:
    type: BOOLEAN
    displayName: Pause when hidden
    description: Pause playback while the browser tab is hidden. Enabled by default.
