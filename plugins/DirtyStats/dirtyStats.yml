name: DirtyStats
description: Build a customizable statistics dashboard and explore origins, growth, ages, ratings, studios, birthdays and cast connections.
version: 0.5.4

exec:
  - python
  - "{pluginDir}/dirty_stats.py"
interface: raw
errLog: error

ui:
  requires:
    - dirtyPlugins
  javascript:
    - vendor/echarts.min.js
    - vendor/world.js
    - dirtyStats.js
    - dirtyStatsDashboard.js
  css:
    - dirtyStats.css
