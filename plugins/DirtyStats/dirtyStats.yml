name: DirtyStats
description: Build a customizable statistics dashboard with performer cards and explore origins, growth, ages, ratings, viewing concentration, efficiency, studios, tags, birthdays and cast connections.
version: 0.6.15

settings:
  visualTheme:
    displayName: Visual theme
    description: Choose the personality used by DirtyStats pages, dashboards, and charts.
    type: STRING

exec:
  - python
  - "{pluginDir}/dirty_stats.py"
interface: raw
errLog: error

ui:
  requires:
    - dirtyPlugins
  javascript:
    - vendor/echarts.min.js
    - vendor/world.js
    - dirtyStats.js
    - dirtyStatsDashboard.js
  css:
    - dirtyStats.css
