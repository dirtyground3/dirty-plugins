name: DirtyStats
description: Build a customizable statistics dashboard with performer cards and explore origins, growth, ages, ratings, viewing concentration, efficiency, studios, tags, birthdays and cast connections.
version: 0.6.41

exec:
  - python
  - "{pluginDir}/dirty_stats.py"
interface: raw
errLog: error

ui:
  requires:
    - dirtyPlugins
  javascript:
    - vendor/echarts.min.js
    - vendor/world.js
    - dirtyStatsGrowth.js
    - dirtyStatsAges.js
    - dirtyStats.js
    - dirtyStatsDashboard.js
  css:
    - dirtyStats.css
