name: DirtyStats
description: Explore origins, growth, ages, ratings, studios and cast connections with native filters and PNG export.
version: 0.3.0

exec:
  - python
  - "{pluginDir}/dirty_stats.py"
interface: raw
errLog: error

ui:
  requires:
    - dirtyPlugins
  javascript:
    - vendor/echarts.min.js
    - vendor/world.js
    - dirtyStats.js
  css:
    - dirtyStats.css
