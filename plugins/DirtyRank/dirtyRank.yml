name: DirtyRank
description: Rank performers through category-based head-to-head battles using a high-precision Glicko-2 system.
version: 0.7.68

ui:
  requires:
    - dirtyPlugins
  javascript:
    - dirtyRank.js
  css:
    - dirtyRank.css

exec:
  - python
  - "{pluginDir}/dirty_rank.py"
interface: raw
errLog: error

settings:
  categories:
    type: STRING
    displayName: Rating categories
    description: Weighted category definitions for each gender box, managed by the DirtyRank settings panel.
  genderBoxes:
    type: STRING
    displayName: Gender boxes
    description: Named groups of performer genders, each with independent categories and ratings. Managed by the DirtyRank settings panel.
  defaultCohort:
    type: STRING
    displayName: Default gender box
    description: The default gender box used for battles and leaderboards.
  enabledCohorts:
    type: STRING
    displayName: Enabled gender boxes
    description: Available gender boxes, managed by the DirtyRank settings panel.
  showBattlesInMenu:
    type: BOOLEAN
    displayName: Show Battles in the Stash header
    description: Add a Battles button to Stash's utility navigation. Enabled by default.
  showLeaderboardsInMenu:
    type: BOOLEAN
    displayName: Show Leaderboards in the Stash header
    description: Add a Leaderboards button to Stash's utility navigation. Enabled by default.
  leaderboardTopCount:
    type: NUMBER
    displayName: Featured leaderboard layout
    description: Number of performers featured in the Podium, Mount Rushmore, or Fingers layout.
  leaderboardView:
    type: STRING
    displayName: Leaderboard standings view
    description: Show full leaderboard standings as a Gallery or Table.
  leaderboardPerformerCount:
    type: NUMBER
    displayName: Performers per leaderboard page
    description: Total performers per page, including the featured top. Must be a multiple of 3 for Podium, 4 for Mount Rushmore, or 5 for Fingers, with at least two rows. Defaults to 18, rounded up for the selected layout.
  overallScoreStrategy:
    type: STRING
    displayName: Overall scoring strategy
    description: Choose Simple weighted (default) or Power mean. Applies to existing overall scores without changing category ratings or battle history.
  overallPower:
    type: NUMBER
    displayName: Power mean exponent
    description: Emphasis on stronger category scores. 1 matches Simple weighted; 3 is the default for this strategy. Range 1 to 4, including decimals.
  showRatingsBeforeVote:
    type: BOOLEAN
    displayName: Show ratings before voting
    description: Reveal ratings and ranks before choosing a performer. Disabled by default to reduce bias.
  hidePerformerImages:
    type: BOOLEAN
    displayName: Hide performer images in battles
    description: Remove performer profile images from battle cards. Disabled by default.
  hideBattleStandings:
    type: BOOLEAN
    displayName: Hide standings during battles
    description: Hide the right-hand standings and expand standard and Gauntlet battles. King of the hill always hides standings. Disabled by default.
  autoPlayTopScenes:
    type: BOOLEAN
    displayName: Automatically play top scenes
    description: Open each performer's highest-rated full scene in battles, muted, at a random point between 30% and 70%. Disabled by default. Photos remain clickable for voting unless hidden.
  includePerformersWithoutImages:
    type: BOOLEAN
    displayName: Include performers without images
    description: Allow performers without a profile image to appear in battles.
  confidenceGoal:
    type: STRING
    displayName: Confidence goal
    description: Optimize information-gain matchmaking for every rating, leaderboard order, or a top-N leaderboard. Defaults to leaderboard order.
  confidenceTopN:
    type: NUMBER
    displayName: Confidence top N
    description: Number of top performers to stabilize when the top-N confidence goal is selected. Defaults to 20.
  avoidRepeatWindow:
    type: NUMBER
    displayName: Repeat avoidance window
    description: Number of recent pairs to avoid when alternatives are available. Defaults to 12.
  calibrationPercent:
    type: NUMBER
    displayName: Calibration match percentage
    description: Percentage of matchmaking searches favouring broader rating gaps. A soft preference within the information-gain optimizer. Defaults to 10.
  initialRating:
    type: NUMBER
    displayName: Initial rating
    description: Starting rating for a new category and cohort pool. Defaults to 1000.
  initialDeviation:
    type: NUMBER
    displayName: Initial rating deviation
    description: Starting uncertainty for an unrated performer. Defaults to 350.
  initialVolatility:
    type: NUMBER
    displayName: Initial volatility
    description: Starting Glicko-2 volatility. Defaults to 0.06.
  evidenceWeight:
    type: NUMBER
    displayName: Evidence per battle
    description: Strength of one subjective comparison in the Glicko-2 update. 1 is standard evidence; 2 doubles the information contribution while recording one battle. Defaults to 2.
  tau:
    type: NUMBER
    displayName: Glicko-2 tau
    description: Controls how quickly volatility may change. Defaults to 0.5.
  deviationFloor:
    type: NUMBER
    displayName: Rating deviation floor
    description: Minimum uncertainty retained for highly precise ratings. Defaults to 30.
  provisionalDeviation:
    type: NUMBER
    displayName: Provisional threshold
    description: Ratings at or below this deviation are Refined; Excellent uses 60% of this threshold or the deviation floor, whichever is higher. Defaults to 100.
