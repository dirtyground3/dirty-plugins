name: DirtyRank
description: Rank performers through category-based head-to-head battles, with one verdict per pair and ratings fitted to every verdict.
version: 1.1.4

ui:
  requires:
    - dirtyPlugins
  javascript:
    - dirtyRank.js
  css:
    - dirtyRank.css

exec:
  - python
  - "{pluginDir}/dirty_rank.py"
interface: raw
errLog: error
