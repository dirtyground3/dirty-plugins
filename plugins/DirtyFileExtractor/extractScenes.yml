name: DirtyFileExtractor
description: Copy selected scene and image files or extract selected marker clips into a separate folder without changing the originals.
version: 0.3.3

ui:
  requires:
    - dirtyPlugins
  javascript:
    - extractScenes.js
  css:
    - extractScenes.css

exec:
  - python
  - "{pluginDir}/extract_scenes.py"
interface: raw
errLog: error

settings:
  destinationFolder:
    displayName: Destination folder
    description: Choose an existing folder with Browse, or edit the absolute path manually. The path is on the machine running Stash.
    type: STRING
  collisionPolicy:
    displayName: File collision policy
    description: "rename (default), skip, or overwrite. Rename adds a numeric suffix and never replaces an existing file."
    type: STRING
  createSceneFolders:
    displayName: Create a folder for each item
    description: Put scenes and marker clips in scene-title folders, and images in image-title folders. Disabled by default.
    type: BOOLEAN
  dryRun:
    displayName: Dry run
    description: Report what would be copied without writing any files. Disabled by default.
    type: BOOLEAN
  maxCopySpeedMBps:
    displayName: Maximum copy speed (MiB/s)
    description: Limit disk usage so Stash stays responsive. Defaults to 20 MiB/s. Set to 0 for unlimited speed.
    type: NUMBER
