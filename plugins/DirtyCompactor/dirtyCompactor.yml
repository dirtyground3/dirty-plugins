name: DirtyCompactor
description: Reclaim space with ordered scene-filter rules, optional output review, and recoverable media replacement.
version: 1.0.3
ui:
  requires:
    - dirtyPlugins
  javascript:
    - dirtyCompactor.js
  css:
    - dirtyCompactor.css
  assets:
    /previews: runtime/previews
exec:
  - python
  - "{pluginDir}/dirty_compactor.py"
interface: raw
errLog: error
