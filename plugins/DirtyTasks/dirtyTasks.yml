name: DirtyTasks
description: Organize scene files, create additional encoded versions, update tags from a selected tagger, and back up library data.
version: 1.0.13-rc
ui:
  requires:
    - dirtyPlugins
  javascript:
    - dirtyTasks.js
  css:
    - dirtyTasks.css
exec:
  - python
  - "{pluginDir}/dirty_tasks.py"
interface: raw
errLog: error
tasks:
  - name: Back up library data
    description: Save the Stash database, blobs, configuration, custom scrapers and DirtyPlugins data into one zip in Stash's backup folder.
    defaultArgs:
      task: backup
